[pytest]
testpaths = tests
python_files = teste_*.py test_*.py
pythonpath = .
markers =
    caso1: Caso 1 - diferenças tipográficas/grafia (acentuação, apóstrofo, cedilha)
    caso2: Caso 2 - sobrenome + iniciais abreviadas
    caso3: Caso 3 - partículas "de" e ponto opcional em abreviações
    caso4: Caso 4 - iniciais do nome e sobrenomes agrupadas
    caso5: Caso 5 - IDs diferentes para o mesmo autor
    integracao: testes de integração do pipeline completo de desduplicação
